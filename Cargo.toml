[package]
name = "lamda_red"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Compile Drizzle requirements engineering diagrams into PNG and mxGraph XML"
repository = "https://github.com/Asncodes-80/lamda_red"
default-run = "lmdred"

[[bin]]
name = "lmdred"
path = "src/main.rs"

[dependencies]
cosmic-text = "0.19"
pest = "2.7.11"
pest_derive = "2.7.11"
tiny-skia = "0.12"
unicode-segmentation = "1"
